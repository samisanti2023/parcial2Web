name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: library
          POSTGRES_PASSWORD: library
          POSTGRES_DB: library_loans
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: library
      DB_PASSWORD: library
      DB_NAME: library_loans
      DB_SYNCHRONIZE: "false"
      DB_LOGGING: "false"
      JWT_ACCESS_SECRET: ci-access-secret-that-is-at-least-32-characters-long
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-at-least-32-characters-long
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: "4"
      MAX_ACTIVE_LOANS: "3"
      DAILY_FINE_RATE: "0.50"
      MAX_LOAN_DAYS: "30"
      NODE_ENV: test
      API_PREFIX: api
      PORT: "3000"
      SWAGGER_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Run migrations
        run: npm run migration:run

      - name: E2e tests
        run: npm run test:e2e

      - name: Docker build
        run: docker build -t library-loans-api:ci .
